<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>التحكم - بث مباشر</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0f172a;color:#f1f5f9;font-family:Segoe UI,system-ui;overflow-x:hidden}
#bar{background:#1e293b;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #334155;position:sticky;top:0;z-index:10}
#bar h1{font-size:15px;color:#38bdf8}
#bar select, #bar button{background:#334155;color:#f1f5f9;border:1px solid #475569;padding:6px 10px;border-radius:6px;font-size:13px}
#bar button{background:#3b82f6;border-color:#2563eb;font-weight:bold;cursor:pointer}
/* منطقة البث + الزوم */
#streamWrap{position:relative;width:100%;background:#020617;overflow:hidden;touch-action:none;max-height:42vh;min-height:220px;display:flex;align-items:center;justify-content:center}
#stream{max-width:100%;max-height:42vh;object-fit:contain;transform-origin:center center;user-select:none;-webkit-user-drag:none}
#zoomBar{position:absolute;top:8px;left:8px;display:flex;gap:6px;z-index:5}
#zoomBar button{background:rgba(30,41,59,.9);color:#fff;border:1px solid #475569;width:38px;height:38px;border-radius:10px;font-size:18px;font-weight:bold}
#zoomLbl{position:absolute;bottom:8px;left:8px;background:rgba(15,23,42,.85);padding:4px 10px;border-radius:12px;font-size:12px;border:1px solid #334155}
#vcursor{position:absolute;z-index:6;font-size:30px;color:#38bdf8;text-shadow:0 0 4px #000,0 0 2px #000;pointer-events:none;display:none;transform:translate(-3px,-3px);line-height:1}
/* لوحة اللمس */
#padSection{padding:10px}
#pad{background:#1e293b;border:2px dashed #3b82f6;border-radius:14px;height:190px;display:flex;flex-direction:column;align-items:center;justify-content:center;touch-action:none;user-select:none;gap:4px}
#pad span{color:#94a3b8;font-size:13px;pointer-events:none}
#pad b{color:#38bdf8;font-size:15px;pointer-events:none}
/* أزرار الماوس */
#mouseBtns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:0 10px 6px}
#mouseBtns button{background:#334155;color:#fff;border:1px solid #475569;border-radius:12px;padding:14px 6px;font-size:15px;font-weight:bold;touch-action:manipulation}
#mouseBtns button:active{background:#3b82f6}
#btnLeft{background:#2563eb !important;border-color:#1d4ed8 !important}
/* الحالة والكيبورد */
#status{text-align:center;background:rgba(15,23,42,.9);padding:8px;font-size:13px;border-top:1px solid #334155;border-bottom:1px solid #334155}
#kbd{padding:8px 10px;display:none;gap:6px}
#kbd input{flex:1;background:#0f172a;color:#f1f5f9;border:1px solid #334155;padding:10px;border-radius:8px;font-size:14px}
#kbd button{background:#3b82f6;color:white;border:none;padding:10px 14px;border-radius:8px;font-weight:bold}
</style>
</head>
<body>
<div id="bar">
  <h1>🖥 التحكم المباشر <small id="verBadge" style="font-size:10px;background:#3b82f6;padding:2px 8px;border-radius:10px">v3</small></h1>
  <div>
    <select id="deviceSel"><option>جاري التحميل...</option></select>
    <button id="btnConnect">اتصال</button>
    <button id="btnClose" style="background:#dc2626">إغلاق</button>
  </div>
</div>
<div id="streamWrap">
  <img id="stream" alt="بث الشاشة" draggable="false">
  <div id="vcursor">➤</div>
  <div id="zoomBar">
    <button id="zIn">+</button>
    <button id="zOut">−</button>
    <button id="zReset" style="font-size:13px;width:auto;padding:0 10px">1x</button>
  </div>
  <div id="zoomLbl">زوم 1x — قرّب بإصبعين</div>
</div>
<div id="status">اختر جهازاً واضغط اتصال</div>
<div id="padSection">
  <div id="pad"><b>👆 لوحة اللمس</b><span>اسحب لتحريك المؤشر الأزرق • انقرة = نقل ونقرة في مكانه</span><span>إصبعان: حركة = سكرول • نقرة = كليك يمين في مكان الأزرق</span></div>
</div>
<div id="mouseBtns">
  <button id="btnLeft">🖱 شمال</button>
  <button id="btnRight">🖱 يمين</button>
  <button id="btnKbd">⌨️</button>
  <button id="scrUp">📜 ▲</button>
  <button id="scrDown">📜 ▼</button>
  <button id="btnMid">🖱 وسط</button>
</div>
<div id="kbd">
  <input id="txtInput" placeholder="اكتب نصاً ليُرسل للجهاز...">
  <button id="btnSend">إرسال</button>
  <button id="btnHideKbd" style="background:#475569">إخفاء</button>
</div>
<script>
const SUPABASE_URL = "https://poktdyyucpiesyljxdkg.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBva3RkeXl1Y3BpZXN5bGp4ZGtnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyOTYyOTAsImV4cCI6MjEwMzg3MjI5MH0.-P-4TVEAEkPKQJTXCYU_8sBEewnOTBoKPNJIVjOMU4k";
let fp=null, token=null, frameTimer=null, connected=false;
let VIEW_ONLY=false;
const headers = {apikey:SUPABASE_KEY, Authorization:`Bearer ${SUPABASE_KEY}`, "Content-Type":"application/json", Prefer:"return=representation"};

async function sb(method, path, params="", body=null){
  const url = `${SUPABASE_URL}/rest/v1/${path}${params}`;
  const r = await fetch(url, {method, headers, body: body?JSON.stringify(body):null});
  if(!r.ok) throw new Error(await r.text());
  const t = await r.text();
  return t ? JSON.parse(t) : [];
}
async function loadDevices(){
  const sel=document.getElementById('deviceSel');
  try{
    const rows = await sb('GET','devices','?select=fingerprint,topic_id&limit=50');
    const sess = await sb('GET','web_sessions','?status=eq.active&select=fingerprint,token');
    const map=new Map(sess.map(s=>[s.fingerprint, s.token]));
    sel.innerHTML="";
    if(rows.length===0) sel.innerHTML='<option>لا يوجد جهاز</option>';
    rows.forEach(r=>{
      const opt=document.createElement('option');
      opt.value=r.fingerprint;
      opt.textContent=r.fingerprint.slice(0,8) + (map.has(r.fingerprint)?" ● متصل":" ○");
      if(map.has(r.fingerprint)) opt.dataset.token=map.get(r.fingerprint);
      sel.appendChild(opt);
    });
    sess.forEach(s=>{
      if(!rows.find(r=>r.fingerprint===s.fingerprint)){
        const opt=document.createElement('option');
        opt.value=s.fingerprint;
        opt.textContent=s.fingerprint.slice(0,8)+" ● متصل";
        opt.dataset.token=s.token;
        sel.appendChild(opt);
      }
    });
  }catch(e){ sel.innerHTML=`<option>خطأ: ${e.message.slice(0,60)}</option>`; }
}
function getToken(){
  const sel=document.getElementById('deviceSel');
  const opt=sel.selectedOptions[0];
  return opt ? opt.dataset.token : null;
}
async function startStream(){
  const sel=document.getElementById('deviceSel');
  fp=sel.value;
  token=getToken();
  if(!fp || fp.includes('لا يوجد')){ alert('اختر جهازاً'); return; }
  if(!token){
    document.getElementById('status').textContent='⚠️ الجهاز غير مفعل - اضغط 🎮 تحكم كامل في تليجرام أولاً';
    return;
  }
  connected=true;
  document.getElementById('status').textContent='● متصل - جاري البث...';
  initVC();
  frameTimer=setInterval(fetchFrame, 200);
}
let lastFrameHash='';
function quickHash(s){ let h=0; for(let i=0;i<s.length;i+=4096){ h=(h*31+s.charCodeAt(i))|0; } return h+'_'+s.length; }
async function fetchFrame(){
  if(!connected||!fp||!token) return;
  try{
    const rows=await sb('GET','web_sessions',`?fingerprint=eq.${fp}&token=eq.${token}&select=last_frame`);
    if(rows.length && rows[0].last_frame){
      const f=rows[0].last_frame, h=quickHash(f);
      if(h!==lastFrameHash){ lastFrameHash=h; document.getElementById('stream').src='data:image/jpeg;base64,'+f; }
    }
  }catch(e){ console.log(e); }
}
async function sendControl(obj){
  if(!fp||!token||VIEW_ONLY) return;
  try{
    await sb('PATCH','web_sessions',`?fingerprint=eq.${fp}&token=eq.${token}`,{pending_control:obj});
  }catch(e){ console.log(e); }
}
/* ===== الزوم على صورة البث ===== */
let Z=1, TX=0, TY=0;
const img=document.getElementById('stream');
const streamWrap=document.getElementById('streamWrap');
function applyZoom(){
  Z=Math.min(4,Math.max(1,Z));
  img.style.transform=`translate(${TX}px,${TY}px) scale(${Z})`;
  document.getElementById('zoomLbl').textContent='زوم '+Z.toFixed(1)+'x';
}
function setZoom(z){ Z=z; if(Z===1){TX=0;TY=0;} applyZoom(); }
document.getElementById('zIn').onclick=()=>setZoom(Z+0.5);
document.getElementById('zOut').onclick=()=>setZoom(Z-0.5);
document.getElementById('zReset').onclick=()=>setZoom(1);
let pinchD0=0, panX0=0, panY0=0, panTX0=0, panTY0=0, pinchZ0=1;
streamWrap.addEventListener('touchstart', e=>{
  if(e.touches.length===2){
    pinchD0=Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
    pinchZ0=Z;
  } else if(e.touches.length===1 && Z>1){
    panX0=e.touches[0].clientX; panY0=e.touches[0].clientY; panTX0=TX; panTY0=TY;
  }
}, {passive:true});
streamWrap.addEventListener('touchmove', e=>{
  if(e.touches.length===2){
    const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
    if(pinchD0>0){ Z=pinchZ0*(d/pinchD0); applyZoom(); }
    e.preventDefault();
  } else if(e.touches.length===1 && Z>1){
    TX=panTX0+(e.touches[0].clientX-panX0); TY=panTY0+(e.touches[0].clientY-panY0);
    applyZoom();
    e.preventDefault();
  }
}, {passive:false});
/* ===== المؤشر الوهمي (يظهر في المتصفح فقط - أزرق) ===== */
let VX=0, VY=0, VC_INIT=false;
const vcEl=document.getElementById('vcursor');
function imgBox(){
  const r=img.getBoundingClientRect(), w=streamWrap.getBoundingClientRect();
  return {x:r.left-w.left, y:r.top-w.top, w:r.width, h:r.height};
}
function placeVC(){
  const b=imgBox();
  vcEl.style.left=(b.x+VX)+'px';
  vcEl.style.top=(b.y+VY)+'px';
  vcEl.style.display=connected?'block':'none';
}
function clampVC(){
  const b=imgBox();
  VX=Math.min(Math.max(VX,0),Math.max(b.w,1));
  VY=Math.min(Math.max(VY,0),Math.max(b.h,1));
}
function moveVC(dx,dy){
  if(!connected||VIEW_ONLY) return;
  if(Z!==1) setZoom(1);
  VX+=dx; VY+=dy; clampVC(); placeVC();
}
function vcToFrame(){
  const b=imgBox();
  return {fx:Math.round(VX/Math.max(b.w,1)*img.naturalWidth), fy:Math.round(VY/Math.max(b.h,1)*img.naturalHeight)};
}
function clickAt(button){
  if(!connected||VIEW_ONLY) return;
  const f=vcToFrame();
  sendControl({action:'click_at', fx:f.fx, fy:f.fy, button:button||'left'});
}
function initVC(){
  const b=imgBox();
  if(!VC_INIT){ VX=(b.w||300)/2; VY=(b.h||200)/2; VC_INIT=true; }
  clampVC(); placeVC();
}
img.addEventListener('load', ()=>{
  if(!VC_INIT){ const b=imgBox(); VX=b.w/2; VY=b.h/2; VC_INIT=true; }
  placeVC();
});
window.addEventListener('resize', placeVC);
setInterval(()=>{ if(connected) placeVC(); }, 800); // تثبيت الظهور دورياً
/* ===== لوحة اللمس (تاتش باد) ===== */
const pad=document.getElementById('pad');
let pDown=false, pT0=0, pX0=0, pY0=0, pLastX=0, pLastY=0, pMoved=0, pFingers=0;
let pLastSend=0, accDX=0, accDY=0;
let p2Y0=0, p2LastY=0;
function padPos(t){ const r=pad.getBoundingClientRect(); return {x:t.clientX-r.left, y:t.clientY-r.top}; }
pad.addEventListener('touchstart', e=>{
  if(Z!==1) setZoom(1);
  pFingers=e.touches.length;
  if(pFingers===1){
    const p=padPos(e.touches[0]);
    pDown=true; pT0=Date.now(); pX0=p.x; pY0=p.y; pLastX=p.x; pLastY=p.y; pMoved=0; accDX=0; accDY=0;
  } else if(pFingers===2){
    const p=padPos(e.touches[0]);
    p2Y0=p.y; p2LastY=p.y; pDown=false;
  }
  e.preventDefault();
}, {passive:false});
pad.addEventListener('touchmove', e=>{
  if(e.touches.length===1 && pDown){
    const p=padPos(e.touches[0]);
    const dx=p.x-pLastX, dy=p.y-pLastY;
    pMoved+=Math.abs(dx)+Math.abs(dy);
    pLastX=p.x; pLastY=p.y;
    moveVC(dx*2.0, dy*2.0); // تحريك المؤشر الوهمي فقط - بلا إرسال
  } else if(e.touches.length===2){
    const p=padPos(e.touches[0]);
    const dy=p.y-p2LastY;
    p2LastY=p.y;
    if(Math.abs(dy)>6){ sendControl({action:'scroll',dy:dy>0?-120:120}); }
  }
  e.preventDefault();
}, {passive:false});
function padEnd(e){
  if(pFingers===1 && pDown){
    const dt=Date.now()-pT0;
    if(dt<260 && pMoved<14){ clickAt('left'); } // نقل الماوس الفعلي لمكان الوهمي + نقرة
  } else if(pFingers===2){
    const dt=Date.now()-pT0;
    if(dt<300){ clickAt('right'); } // نقرة يمين في مكان الوهمي
  }
  pDown=false; pFingers=0;
}
pad.addEventListener('touchend', padEnd);
pad.addEventListener('touchcancel', ()=>{ pDown=false; pFingers=0; });
// دعم الماوس على اللوحة (للتجربة من PC)
let mDown=false, mLX=0, mLY=0, mAccX=0, mAccY=0, mLastSend=0;
pad.addEventListener('mousedown', e=>{ mDown=true; mLX=e.clientX; mLY=e.clientY; mAccX=0; mAccY=0; });
window.addEventListener('mousemove', e=>{
  if(!mDown) return;
  moveVC((e.clientX-mLX)*2.0, (e.clientY-mLY)*2.0);
  mLX=e.clientX; mLY=e.clientY;
});
window.addEventListener('mouseup', ()=>{ mDown=false; });
/* ===== أزرار الماوس ===== */
function holdRepeat(el, fn){
  let iv=null, to=null;
  const start=e=>{ e.preventDefault(); fn(); to=setTimeout(()=>{ iv=setInterval(fn,120); },400); };
  const stop=()=>{ clearTimeout(to); clearInterval(iv); };
  el.addEventListener('touchstart', start, {passive:false});
  el.addEventListener('touchend', stop);
  el.addEventListener('touchcancel', stop);
  el.addEventListener('mousedown', start);
  el.addEventListener('mouseup', stop);
  el.addEventListener('mouseleave', stop);
}
document.getElementById('btnLeft').onclick=()=>clickAt('left');
document.getElementById('btnRight').onclick=()=>clickAt('right');
document.getElementById('btnMid').onclick=()=>clickAt('middle');
holdRepeat(document.getElementById('scrUp'), ()=>sendControl({action:'scroll',dy:120}));
holdRepeat(document.getElementById('scrDown'), ()=>sendControl({action:'scroll',dy:-120}));
/* ===== الكيبورد ===== */
document.getElementById('btnKbd').onclick=()=>{
  const k=document.getElementById('kbd');
  k.style.display=(k.style.display==='flex')?'none':'flex';
  if(k.style.display==='flex') document.getElementById('txtInput').focus();
};
document.getElementById('txtInput').addEventListener('keydown', e=>{
  if(e.key==='Enter'){
    const txt=e.target.value;
    if(txt){ sendControl({action:'type',text:txt}); e.target.value=''; }
  }
});
document.getElementById('btnSend').onclick=()=>{
  const txt=document.getElementById('txtInput').value;
  if(txt){ sendControl({action:'type',text:txt}); document.getElementById('txtInput').value=''; }
};
document.getElementById('btnHideKbd').onclick=()=>{ document.getElementById('kbd').style.display='none'; };
// Controls
document.getElementById('btnConnect').onclick=startStream;
document.getElementById('btnClose').onclick=async()=>{
  if(!fp||!token) return;
  try{ await sb('PATCH','web_sessions',`?token=eq.${token}`,{status:'closed'}); }catch(e){}
  connected=false;
  clearInterval(frameTimer);
  document.getElementById('status').textContent='تم إغلاق البث';
  document.getElementById('stream').src='';
};
// lifecycle: عند إغلاق الصفحة أغلق البث
window.addEventListener('beforeunload', ()=>{
  if(fp&&token){
    try{ fetch(`${SUPABASE_URL}/rest/v1/web_sessions?token=eq.${token}`, {method:'PATCH', headers, body:JSON.stringify({status:'closed'}), keepalive:true}); }catch(e){}
  }
});
window.addEventListener('pagehide', ()=>{
  if(fp&&token){
    try{ fetch(`${SUPABASE_URL}/rest/v1/web_sessions?token=eq.${token}`, {method:'PATCH', headers, body:JSON.stringify({status:'closed'}), keepalive:true}); }catch(e){}
  }
});
loadDevices();
setInterval(()=>{ if(!connected) loadDevices(); }, 5000);
// فتح مباشر من رابط تليجرام ?fp=..&token=.. : اتصال تلقائي بدون اختيار
(function(){
  try{
    const q=new URLSearchParams(location.search);
    const qfp=q.get('fp'), qtok=q.get('token');
    if(qfp && qtok){
      fp=qfp; token=qtok; connected=true;
      VIEW_ONLY = (q.get('mode')==='view');
      if(VIEW_ONLY){
        document.getElementById('status').textContent='● مشاهدة فقط - التحكم معطل';
        document.getElementById('padSection').style.display='none';
        document.getElementById('mouseBtns').style.display='none';
        document.getElementById('kbd').style.display='none';
      } else {
        document.getElementById('status').textContent='● متصل - جاري البث...';
      }
      initVC();
      frameTimer=setInterval(fetchFrame, 200);
    }
  }catch(e){ console.log(e); }
})();
</script>
</body>
</html>
