<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>التحكم - بث مباشر</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0f172a;color:#f1f5f9;font-family:Segoe UI,system-ui;overflow:hidden}
#bar{background:#1e293b;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #334155}
#bar h1{font-size:15px;color:#38bdf8}
#bar select, #bar button{background:#334155;color:#f1f5f9;border:1px solid #475569;padding:6px 10px;border-radius:6px;font-size:13px}
#bar button{background:#3b82f6;border-color:#2563eb;font-weight:bold;cursor:pointer}
#wrap{position:relative;width:100%;height:calc(100vh - 52px);background:#020617;display:flex;align-items:center;justify-content:center;overflow:hidden}
#stream{max-width:100%;max-height:100%;object-fit:contain;background:#020617}
#canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
#status{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);background:rgba(15,23,42,0.85);padding:6px 12px;border-radius:20px;font-size:12px;border:1px solid #334155}
#kbd{position:fixed;bottom:0;left:0;right:0;background:#1e293b;border-top:1px solid #334155;padding:8px;display:none;gap:6px}
#kbd input{flex:1;background:#0f172a;color:#f1f5f9;border:1px solid #334155;padding:8px;border-radius:6px}
#kbd button{background:#3b82f6;color:white;border:none;padding:8px 14px;border-radius:6px;font-weight:bold}
</style>
</head>
<body>
<div id="bar">
  <h1>🖥 التحكم المباشر</h1>
  <div>
    <select id="deviceSel"><option>جاري التحميل...</option></select>
    <button id="btnConnect">اتصال</button>
    <button id="btnClose" style="background:#dc2626">إغلاق البث</button>
  </div>
</div>
<div id="wrap">
  <img id="stream" alt="بث الشاشة">
  <canvas id="canvas"></canvas>
  <div id="status">اختر جهازاً واضغط اتصال</div>
</div>
<div id="kbd">
  <input id="txtInput" placeholder="اكتب نصاً ليُرسل للجهاز...">
  <button id="btnSend">إرسال</button>
  <button id="btnHideKbd" style="background:#475569">إخفاء</button>
</div>
<script>
const SUPABASE_URL = "https://poktdyyucpiesyljxdkg.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBva3RkeXl1Y3BpZXN5bGp4ZGtnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyOTYyOTAsImV4cCI6MjEwMzg3MjI5MH0.-P-4TVEAEkPKQJTXCYU_8sBEewnOTBoKPNJIVjOMU4k";
let fp=null, token=null, frameTimer=null, connected=false;
const headers = {apikey:SUPABASE_KEY, Authorization:`Bearer ${SUPABASE_KEY}`, "Content-Type":"application/json", Prefer:"return=representation"};

async function sb(method, path, params="", body=null){
  const url = `${SUPABASE_URL}/rest/v1/${path}${params}`;
  const r = await fetch(url, {method, headers, body: body?JSON.stringify(body):null});
  if(!r.ok) throw new Error(await r.text());
  const t = await r.text();
  return t ? JSON.parse(t) : [];
}
async function loadDevices(){
  const sel=document.getElementById('deviceSel');
  try{
    const rows = await sb('GET','devices','?select=fingerprint,topic_id&limit=50');
    // fallback to web_sessions active
    const sess = await sb('GET','web_sessions','?status=eq.active&select=fingerprint,token');
    const map=new Map(sess.map(s=>[s.fingerprint, s.token]));
    sel.innerHTML="";
    if(rows.length===0) sel.innerHTML='<option>لا يوجد جهاز</option>';
    rows.forEach(r=>{
      const opt=document.createElement('option');
      opt.value=r.fingerprint;
      opt.textContent=r.fingerprint.slice(0,8) + (map.has(r.fingerprint)?" ● متصل":" ○");
      if(map.has(r.fingerprint)) opt.dataset.token=map.get(r.fingerprint);
      sel.appendChild(opt);
    });
    // also add sessions not in devices
    sess.forEach(s=>{
      if(!rows.find(r=>r.fingerprint===s.fingerprint)){
        const opt=document.createElement('option');
        opt.value=s.fingerprint;
        opt.textContent=s.fingerprint.slice(0,8)+" ● متصل";
        opt.dataset.token=s.token;
        sel.appendChild(opt);
      }
    });
  }catch(e){ sel.innerHTML=`<option>خطأ: ${e.message.slice(0,60)}</option>`; }
}
function getToken(){
  const sel=document.getElementById('deviceSel');
  const opt=sel.selectedOptions[0];
  return opt ? opt.dataset.token : null;
}
async function startStream(){
  const sel=document.getElementById('deviceSel');
  fp=sel.value;
  token=getToken();
  if(!fp || fp.includes('لا يوجد')){ alert('اختر جهازاً'); return; }
  // إذا لا يوجد token، حاول إنشاء جلسة عبر تليجرام - للآن نطلب من المستخدم تفعيل من تليجرام أولاً
  if(!token){
    document.getElementById('status').textContent='⚠️ الجهاز غير مفعل - اضغط 🎮 تحكم كامل في تليجرام أولاً';
    return;
  }
  connected=true;
  document.getElementById('status').textContent='● متصل - جاري البث...';
  frameTimer=setInterval(fetchFrame, 350);
  // إرسال heartbeat كل 5ث لتجديد الجلسة
}
async function fetchFrame(){
  if(!connected||!fp||!token) return;
  try{
    const rows=await sb('GET','web_sessions',`?fingerprint=eq.${fp}&token=eq.${token}&select=last_frame`);
    if(rows.length && rows[0].last_frame){
      document.getElementById('stream').src='data:image/jpeg;base64,'+rows[0].last_frame;
    }
  }catch(e){ console.log(e); }
}
async function sendControl(obj){
  if(!fp||!token) return;
  try{
    await sb('PATCH','web_sessions',`?fingerprint=eq.${fp}&token=eq.${token}`,{pending_control:obj});
  }catch(e){ console.log(e); }
}
// Canvas interaction
const canvas=document.getElementById('canvas');
const wrap=document.getElementById('wrap');
let isDown=false, last={x:0,y:0};
function posFromEvent(e){
  const rect=canvas.getBoundingClientRect();
  const img=document.getElementById('stream');
  // حساب نسبة الصورة داخل الـ wrap
  const scaleX = img.naturalWidth ? img.naturalWidth / img.clientWidth : 1;
  const scaleY = img.naturalHeight ? img.naturalHeight / img.clientHeight : 1;
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  // تحويل إحداثيات الـ canvas إلى إحداثيات الشاشة الأصلية (تقديري)
  // نرسل delta للتحريك النسبي بدل مطلق لتجنب حساب خاطئ
  return {x: clientX - rect.left, y: clientY - rect.top, scaleX, scaleY};
}
canvas.addEventListener('mousedown', e=>{ isDown=true; last=posFromEvent(e); });
canvas.addEventListener('touchstart', e=>{ isDown=true; last=posFromEvent(e); e.preventDefault(); }, {passive:false});
canvas.addEventListener('mousemove', e=>{
  if(!isDown) return;
  const cur=posFromEvent(e);
  const dx=Math.round((cur.x-last.x)*2);
  const dy=Math.round((cur.y-last.y)*2);
  if(Math.abs(dx)>2||Math.abs(dy)>2){
    sendControl({action:'move',dx,dy});
    last=cur;
  }
});
canvas.addEventListener('touchmove', e=>{
  if(!isDown) return;
  const cur=posFromEvent(e);
  const dx=Math.round((cur.x-last.x)*2);
  const dy=Math.round((cur.y-last.y)*2);
  if(Math.abs(dx)>2||Math.abs(dy)>2){
    sendControl({action:'move',dx,dy});
    last=cur;
  }
  e.preventDefault();
}, {passive:false});
canvas.addEventListener('mouseup', e=>{
  if(isDown){
    isDown=false;
    // نقرة إذا لم يتحرك كثيراً
    sendControl({action:'click',button:'left'});
  }
});
canvas.addEventListener('touchend', e=>{
  if(isDown){
    isDown=false;
    sendControl({action:'click',button:'left'});
  }
});
canvas.addEventListener('click', e=>{
  // نقرة سريعة إضافية
  // sendControl already via mouseup
});
// Keyboard
document.getElementById('txtInput').addEventListener('keydown', e=>{
  if(e.key==='Enter'){
    const txt=e.target.value;
    if(txt){ sendControl({action:'type',text:txt}); e.target.value=''; }
  }
});
document.getElementById('btnSend').onclick=()=>{
  const txt=document.getElementById('txtInput').value;
  if(txt){ sendControl({action:'type',text:txt}); document.getElementById('txtInput').value=''; }
};
document.getElementById('btnHideKbd').onclick=()=>{ document.getElementById('kbd').style.display='none'; };
canvas.addEventListener('dblclick', ()=>{ document.getElementById('kbd').style.display='flex'; document.getElementById('txtInput').focus(); });
// Controls
document.getElementById('btnConnect').onclick=startStream;
document.getElementById('btnClose').onclick=async()=>{
  if(!fp||!token) return;
  try{ await sb('PATCH','web_sessions',`?token=eq.${token}`,{status:'closed'}); }catch(e){}
  connected=false;
  clearInterval(frameTimer);
  document.getElementById('status').textContent='تم إغلاق البث';
  document.getElementById('stream').src='';
};
// lifecycle: عند إغلاق الصفحة أغلق البث
window.addEventListener('beforeunload', ()=>{
  if(fp&&token){
    navigator.sendBeacon(`${SUPABASE_URL}/rest/v1/web_sessions?token=eq.${token}`, JSON.stringify({status:'closed'}));
    // sendBeacon لا يدعم headers مخصصة - نستخدم fetch keepalive كـ fallback
    try{ fetch(`${SUPABASE_URL}/rest/v1/web_sessions?token=eq.${token}`, {method:'PATCH', headers, body:JSON.stringify({status:'closed'}), keepalive:true}); }catch(e){}
  }
});
window.addEventListener('pagehide', ()=>{
  if(fp&&token){
    try{ fetch(`${SUPABASE_URL}/rest/v1/web_sessions?token=eq.${token}`, {method:'PATCH', headers, body:JSON.stringify({status:'closed'}), keepalive:true}); }catch(e){}
  }
});
loadDevices();
setInterval(()=>{ if(!connected) loadDevices(); }, 5000);
// فتح مباشر من رابط تليجرام ?fp=..&token=.. : اتصال تلقائي بدون اختيار
(function(){
  try{
    const q=new URLSearchParams(location.search);
    const qfp=q.get('fp'), qtok=q.get('token');
    if(qfp && qtok){
      fp=qfp; token=qtok; connected=true;
      document.getElementById('status').textContent='● متصل - جاري البث...';
      frameTimer=setInterval(fetchFrame, 350);
    }
  }catch(e){ console.log(e); }
})();
</script>
</body>
</html>
